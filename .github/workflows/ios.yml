name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test iOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((d["udid"] for runtime, devices in data["devices"].items() if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS") for d in devices if d["name"].startswith("iPhone")), ""))')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi
          echo "udid=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: >-
          xcodebuild test
          -project illia.xcodeproj
          -scheme illia
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
          -derivedDataPath build/DerivedData
          -resultBundlePath build/TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
