name: Unsigned iOS archive

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive:
    name: Create unsigned archive
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive app without signing
        run: >-
          xcodebuild archive
          -project illia.xcodeproj
          -scheme illia
          -destination 'generic/platform=iOS'
          -archivePath build/illia.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          ditto build/illia.xcarchive/Products/Applications/illia.app build/ipa/Payload/illia.app
          cd build/ipa
          zip -qry ../illia-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: illia-unsigned-ipa
          path: build/illia-unsigned.ipa
          if-no-files-found: error
