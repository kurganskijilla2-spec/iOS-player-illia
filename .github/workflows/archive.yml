name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app for iPhone
        run: >-
          xcodebuild build
          -project illia.xcodeproj
          -scheme illia
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/illia.app"
          test -d "$APP_PATH"
          mkdir -p build/package/Payload
          ditto "$APP_PATH" build/package/Payload/illia.app
          cd build/package
          zip -qry ../illia.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: illia-ipa
          path: build/illia.ipa
          if-no-files-found: error
